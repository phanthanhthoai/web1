<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập quản trị | TechZone</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="admin-login-page">

    <main class="container">
        <div class="auth-card">

            <section class="panel">

                <div class="auth-logo">
                    TECHZONE ADMIN
                </div>

                <h1 style="text-align: center;">
                    Đăng nhập quản trị viên
                </h1>
<form id="admin-login" class="login-demo-form" data-ui-only novalidate>

                    <div class="field">
                        <label for="admin-user">
                            Tên đăng nhập
                        </label>

                        <input
                            id="admin-user"
                            type="text"
                            placeholder="admin"
                        >
                    </div>

                    <div class="field">
                        <label for="admin-pass">
                            Mật khẩu
                        </label>

                        <input
                            id="admin-pass"
                            type="password"
                            placeholder="admin123"
                        >
                    </div>

                    <button class="btn" type="submit">
                        Đăng nhập
                    </button>

                </form>
                <p class="help" style="text-align:center;margin-top:18px">Đây là giao diện đăng nhập minh họa. Nhấn “Đăng nhập” để vào trang quản trị.</p>
                <p style="text-align:center"><a href="index.html">Quay về trang bán hàng</a></p>

            </section>

        </div>
    </main>
    <script src="js/site.js" defer></script>
</body>

</html>
