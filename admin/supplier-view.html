<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Thông tin nhà cung cấp | TechZone</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Top Bar -->
    <div class="topbar">
        <span>Hệ thống quản lý cửa hàng máy tính</span>
        <span>Khu vực quản trị</span>
    </div>

    <!-- Main Content -->
    <main class="container">

        <div class="breadcrumbs">
            <a href="suppliers.html">
                Quay lại danh sách
            </a>
            /
            Thông tin nhà cung cấp
        </div>

        <section class="panel record-view">

            <h1>Thông tin nhà cung cấp</h1>

            <p class="badge">
                Mã: NCC001
            </p>

            <h2>Công ty Phân phối ABC</h2>

            <dl class="detail-list">

                <div>
                    <dt>Số điện thoại</dt>
                    <dd>028 1234 5678</dd>
                </div>

                <div>
                    <dt>Email</dt>
                    <dd>sales@abc.example</dd>
                </div>

                <div>
                    <dt>Địa chỉ</dt>
                    <dd>TP. Hồ Chí Minh</dd>
                </div>

                <div>
                    <dt>Trạng thái</dt>
                    <dd>Đang hợp tác</dd>
                </div>

            </dl>

            <a class="btn secondary" href="suppliers.html">
                Thoát
            </a>

        </section>

    </main>

    <script src="../js/site.js" defer></script>

    <script>
        (function () {

            const suppliers = {

                NCC001: {
                    name: "Công ty Phân phối ABC",
                    phone: "028 1234 5678",
                    email: "sales@abc.example",
                    address: "TP. Hồ Chí Minh",
                    status: "Đang hợp tác"
                },

                NCC002: {
                    name: "Thiết bị số Minh Long",
                    phone: "028 2345 6789",
                    email: "contact@minhlong.example",
                    address: "Bình Dương",
                    status: "Đang hợp tác"
                },

                NCC003: {
                    name: "Công nghệ Sao Việt",
                    phone: "024 3456 7890",
                    email: "info@saoviet.example",
                    address: "Hà Nội",
                    status: "Đang hợp tác"
                }

            };

            const id =
                new URLSearchParams(location.search)
                    .get("id");

            const supplier = suppliers[id];

            if (!supplier) return;

            const title =
                document.querySelector(".record-view h2");

            if (title) {
                title.textContent = supplier.name;
            }

            const badge =
                document.querySelector(".record-view .badge");

            if (badge) {
                badge.textContent = "Mã: " + id;
            }

            const details =
                document.querySelectorAll(
                    ".detail-list dd"
                );

            if (details[0]) details[0].textContent = supplier.phone;
            if (details[1]) details[1].textContent = supplier.email;
            if (details[2]) details[2].textContent = supplier.address;
            if (details[3]) details[3].textContent = supplier.status;

        })();
    </script>

</body>

</html>
